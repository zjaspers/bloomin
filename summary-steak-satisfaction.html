<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Steak Satisfaction Review Summary</title><style>:root{--navy:#1f3b57;--border:#d7dde4;--text:#1f2933;--muted:#607080;--green:#4c9f38;--amber:#d9a629;--red:#c0372b;--blue:#2f5f86}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-width:220px;max-width:900px;margin:0;padding:0;overflow:hidden}body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:transparent;color:var(--text);font-size:12px}.summary-widget{width:100%;background:#fff;border:1px solid var(--border);overflow:hidden}.section-title{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:6px 8px}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:#fff}.kpi{background:#fff;border:1px solid var(--border);box-shadow:0 1px 4px rgba(25,45,65,.12);min-height:62px;padding:7px 8px;position:relative}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}.kpi.good:before{background:var(--green)}.kpi.warn:before{background:var(--amber)}.kpi.bad:before{background:var(--red)}.kpi-label{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi-value{font-size:22px;font-weight:700;color:#12263a;line-height:1;letter-spacing:-.5px}.kpi.good .kpi-value{color:var(--green)}.kpi.warn .kpi-value{color:#b17c10}.kpi.bad .kpi-value{color:var(--red)}.kpi-foot{margin-top:5px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:280px){.kpi-grid{grid-template-columns:1fr}.kpi-value{font-size:20px}}</style></head><body><div class="summary-widget"><div class="section-title">Steak Satisfaction Review</div><div class="kpi-grid"><div class="kpi bad"><div class="kpi-label">STEAK ACCURACY</div><div class="kpi-value">92%</div><div class="kpi-foot">Below company avg</div></div><div class="kpi "><div class="kpi-label">SURVEY COUNT</div><div class="kpi-value">195K</div><div class="kpi-foot">Daily summary</div></div><div class="kpi warn"><div class="kpi-label">TABLE MATE CC</div><div class="kpi-value">90.1%</div><div class="kpi-foot">Payment %</div></div><div class="kpi bad"><div class="kpi-label">REVIEW STATUS</div><div class="kpi-value">Red</div><div class="kpi-foot">MP/JVP action</div></div></div></div></body></html>
